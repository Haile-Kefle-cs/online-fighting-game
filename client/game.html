<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Online Fighting Game - Team Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            background: rgba(0,0,0,0.9);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.8);
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            min-height: 40px;
        }
        .game-info {
            display: flex;
            gap: 6px;
            font-size: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .game-info span {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
        }
        .game-info .team-red {
            background: rgba(255,0,0,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255,0,0,0.3);
        }
        .game-info .team-blue {
            background: rgba(0,100,255,0.2);
            color: #4facfe;
            border: 1px solid rgba(0,100,255,0.3);
        }
        .game-info .alive-count {
            background: rgba(107,203,119,0.2);
            color: #6bcb77;
        }
        #exitBtn {
            padding: 4px 10px;
            background: rgba(255,107,107,0.2);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 10px;
            touch-action: manipulation;
        }
        .game-container {
            position: relative;
            flex: 1;
            touch-action: none;
            min-height: 200px;
        }
        #gameCanvas {
            display: block;
            border-radius: 10px;
            background: #1a0a2e;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }
        
        /* HUD */
        .game-hud {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .health-bar {
            width: 80px;
            background: rgba(0,0,0,0.8);
            border-radius: 4px;
            padding: 2px;
            border: 1.5px solid rgba(255,255,255,0.12);
            position: relative;
        }
        .health-fill {
            height: 12px;
            border-radius: 3px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
        }
        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        .hud-center {
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            pointer-events: none;
        }
        #gameStatus { font-size: 9px; font-weight: bold; }
        #scoreDisplay { font-size: 7px; color: #ffd93d; }
        
        .weapon-hud {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,215,0,0.15);
            color: #fff;
            font-size: 9px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
            white-space: nowrap;
        }
        .weapon-hud .weapon-icon { font-size: 12px; }
        .weapon-hud .weapon-name { color: #ffd93d; font-weight: bold; font-size: 9px; }
        .weapon-hud .weapon-damage { color: #ff6b6b; font-size: 8px; }
        
        .pickup-indicator {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,215,0,0.2);
            color: #ffd93d;
            font-size: 8px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .pickup-indicator.show { opacity: 1; }
        
        .kill-feed {
            position: absolute;
            top: 40px;
            right: 6px;
            z-index: 8;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-end;
            max-width: 160px;
        }
        .kill-msg {
            background: rgba(0,0,0,0.8);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 8px;
            color: #fff;
            border-left: 2px solid #ffd93d;
            animation: killFade 2.5s ease forwards;
            white-space: nowrap;
        }
        .kill-msg .killer { font-weight: bold; }
        .kill-msg .killer.red { color: #ff6b6b; }
        .kill-msg .killer.blue { color: #4facfe; }
        .kill-msg .victim { color: #ff6b6b; font-weight: bold; }
        .kill-msg .weapon { color: #ffd93d; }
        
        @keyframes killFade {
            0% { opacity: 0; transform: translateX(15px); }
            15% { opacity: 1; transform: translateX(0); }
            70% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(15px); }
        }
        
        .center-announcement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: all 0.5s;
        }
        .center-announcement.show {
            opacity: 1;
            animation: announcePop 0.5s ease forwards;
        }
        @keyframes announcePop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .center-announcement .title {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
            padding: 6px 16px;
            border-radius: 10px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,215,0,0.15);
        }
        .center-announcement .subtitle {
            font-size: 12px;
            margin-top: 3px;
            color: #aaa;
        }
        .center-announcement .title.victory { border-color: rgba(255,215,0,0.4); color: #ffd93d; }
        .center-announcement .title.kill { border-color: rgba(255,107,107,0.3); color: #ff6b6b; }
        .center-announcement .title.info { border-color: rgba(79,172,254,0.3); color: #4facfe; }
        
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 25;
            border-radius: 10px;
        }
        .game-over-overlay.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .game-over-box {
            background: rgba(10,10,30,0.95);
            padding: 20px 25px;
            border-radius: 14px;
            border: 2px solid rgba(255,215,0,0.15);
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .game-over-box .title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .game-over-box .title.win { color: #ffd93d; }
        .game-over-box .title.lose { color: #ff6b6b; }
        .game-over-box .subtitle { font-size: 13px; color: #aaa; margin-bottom: 10px; }
        .game-over-box .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .game-over-box .stat-item { text-align: center; }
        .game-over-box .stat-item .value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd93d;
        }
        .game-over-box .stat-item .label { font-size: 8px; color: #888; }
        .game-over-box .stat-item .value.kills { color: #6bcb77; }
        .game-over-box .stat-item .value.deaths { color: #ff6b6b; }
        .game-over-box .stat-item .value.score { color: #ffd93d; }
        
        .game-over-box .winner-info {
            font-size: 12px;
            color: #fff;
            margin: 6px 0;
            padding: 6px;
            background: rgba(255,215,0,0.06);
            border-radius: 5px;
        }
        .game-over-box .winner-info .name { color: #ffd93d; font-weight: bold; font-size: 15px; }
        
        .game-over-box .restart-btn {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: linear-gradient(45deg, #6bcb77, #2d7d46);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .game-over-box .restart-btn.secondary {
            background: linear-gradient(45deg, #4facfe, #0f3460);
            margin-top: 3px;
        }
        .game-over-box .countdown {
            font-size: 10px;
            color: #888;
            margin-top: 6px;
        }
        .game-over-box .countdown .time { color: #ffd93d; font-weight: bold; font-size: 13px; }
        
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 26;
            overflow: hidden;
            border-radius: 10px;
        }
        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            opacity: 0;
            animation: confettiFall 3s ease forwards;
        }
        @keyframes confettiFall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(600px) rotate(720deg); }
        }
        
        /* Touch Controls - Mobile */
        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 4px 4px 0 4px;
            flex-shrink: 0;
            gap: 6px;
            height: 130px;
            touch-action: none;
            background: rgba(0,0,0,0.3);
            border-radius: 10px 10px 0 0;
            margin-top: 4px;
        }
        
        .touch-dpad {
            display: grid;
            grid-template-columns: 48px 48px 48px;
            grid-template-rows: 48px 48px 48px;
            gap: 3px;
            pointer-events: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 4px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .touch-btn {
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            transition: all 0.05s;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            user-select: none;
            font-weight: bold;
        }
        .touch-btn:active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.92);
            border-color: rgba(255,215,0,0.4);
        }
        .touch-btn.empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }
        .touch-btn.center {
            background: rgba(255,215,0,0.1);
            border-color: rgba(255,215,0,0.15);
            font-size: 11px;
        }
        .touch-btn.center:active {
            background: rgba(255,215,0,0.2);
        }
        
        .touch-actions {
            display: grid;
            grid-template-columns: 48px 48px;
            gap: 3px;
            pointer-events: auto;
            flex-shrink: 0;
        }
        .touch-action-btn {
            padding: 4px 6px;
            border-radius: 8px;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            border: 1.5px solid rgba(255,255,255,0.1);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.05s;
            user-select: none;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .touch-action-btn:active {
            transform: scale(0.88);
            filter: brightness(1.3);
        }
        .touch-action-btn.shoot {
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            border-color: #ff6b35;
            font-size: 10px;
            grid-column: span 2;
            min-height: 38px;
            box-shadow: 0 2px 10px rgba(255,69,0,0.2);
        }
        .touch-action-btn.attack {
            background: linear-gradient(135deg, #ffd93d, #f9a825);
            border-color: #ffd93d;
            color: #1a1a2e;
        }
        .touch-action-btn.heavy {
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            border-color: #ff6b6b;
        }
        .touch-action-btn.special {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            border-color: #a29bfe;
        }
        .touch-action-btn.pickup {
            background: linear-gradient(135deg, #ffd93d, #f9a825);
            border-color: #ffd93d;
            color: #1a1a2e;
            grid-column: span 2;
            min-height: 30px;
            font-size: 8px;
        }
        .touch-action-btn .icon { font-size: 14px; display: block; line-height: 1; }
        .touch-action-btn .label { font-size: 6px; opacity: 0.8; margin-top: 1px; }
        .touch-action-btn.shoot .icon { font-size: 17px; }
        .touch-action-btn.shoot .label { font-size: 7px; }
        
        .controls-hint {
            display: none;
        }
        .game-footer {
            display: none;
        }
        
        .sound-toggle {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: #fff;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 9px;
            touch-action: manipulation;
        }
        
        @media (max-width: 480px) {
            .game-wrapper { padding: 4px; border-radius: 8px; }
            .game-header { padding: 3px 6px; min-height: 32px; }
            .game-info span { font-size: 7px; padding: 1px 4px; }
            .health-bar { width: 55px; }
            .health-fill { height: 9px; }
            .health-text { font-size: 5px; }
            #gameStatus { font-size: 7px; }
            #scoreDisplay { font-size: 6px; }
            .hud-center { padding: 1px 4px; }
            
            .touch-controls { height: 100px; padding: 3px; gap: 4px; }
            .touch-dpad {
                grid-template-columns: 38px 38px 38px;
                grid-template-rows: 38px 38px 38px;
                gap: 2px;
                padding: 3px;
            }
            .touch-btn { font-size: 13px; border-radius: 6px; }
            .touch-btn.center { font-size: 9px; }
            .touch-actions { grid-template-columns: 40px 40px; gap: 2px; }
            .touch-action-btn { min-height: 32px; padding: 3px 4px; font-size: 8px; }
            .touch-action-btn.shoot { min-height: 32px; font-size: 9px; }
            .touch-action-btn .icon { font-size: 12px; }
            .touch-action-btn.shoot .icon { font-size: 14px; }
            .touch-action-btn.pickup { min-height: 26px; font-size: 7px; }
            
            .weapon-hud { bottom: 140px; padding: 3px 8px; font-size: 8px; }
            .weapon-hud .weapon-icon { font-size: 10px; }
            .weapon-hud .weapon-name { font-size: 8px; }
            .pickup-indicator { bottom: 170px; font-size: 7px; padding: 2px 8px; }
            .kill-feed { top: 32px; max-width: 120px; }
            .kill-msg { font-size: 7px; padding: 1px 6px; }
            .center-announcement .title { font-size: 18px; padding: 4px 10px; }
            .center-announcement .subtitle { font-size: 10px; }
            .game-over-box { padding: 14px 16px; max-width: 260px; }
            .game-over-box .title { font-size: 24px; }
            .game-over-box .stats { padding: 6px; gap: 3px; }
            .game-over-box .stat-item .value { font-size: 16px; }
            .game-over-box .restart-btn { font-size: 12px; padding: 8px; }
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .game-wrapper { padding: 4px; }
            .game-header { padding: 2px 6px; min-height: 26px; margin-bottom: 4px; }
            .game-info span { font-size: 7px; padding: 1px 4px; }
            .health-bar { width: 50px; }
            .health-fill { height: 8px; }
            .health-text { font-size: 5px; }
            #gameStatus { font-size: 7px; }
            
            .touch-controls { height: 75px; padding: 2px; gap: 3px; }
            .touch-dpad {
                grid-template-columns: 30px 30px 30px;
                grid-template-rows: 30px 30px 30px;
                gap: 2px;
                padding: 2px;
            }
            .touch-btn { font-size: 10px; border-radius: 5px; }
            .touch-btn.center { font-size: 8px; }
            .touch-actions { grid-template-columns: 32px 32px; gap: 2px; }
            .touch-action-btn { min-height: 26px; padding: 2px 4px; font-size: 7px; }
            .touch-action-btn.shoot { min-height: 26px; font-size: 8px; }
            .touch-action-btn .icon { font-size: 10px; }
            .touch-action-btn.shoot .icon { font-size: 12px; }
            .touch-action-btn.pickup { min-height: 22px; font-size: 6px; }
            
            .weapon-hud { bottom: 100px; padding: 2px 6px; font-size: 7px; }
            .weapon-hud .weapon-icon { font-size: 9px; }
            .pickup-indicator { bottom: 130px; font-size: 6px; padding: 2px 6px; }
            .kill-feed { top: 28px; max-width: 100px; }
            .kill-msg { font-size: 6px; padding: 1px 5px; }
            .center-announcement .title { font-size: 16px; padding: 3px 8px; }
            .game-over-box { padding: 10px 12px; max-width: 220px; }
            .game-over-box .title { font-size: 20px; }
            .game-over-box .stats { padding: 4px; gap: 2px; }
            .game-over-box .stat-item .value { font-size: 14px; }
            .game-over-box .restart-btn { font-size: 10px; padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="game-info">
                <span id="roomIdDisplay">🏠 ---</span>
                <span class="team-red" id="teamDisplay">🔴 Red Team</span>
                <span class="alive-count" id="playerCount">👥 0/8</span>
                <span id="killsDisplay">💀 0</span>
                <span id="deathsDisplay">☠️ 0</span>
                <span id="aliveDisplay">✅ 0 Alive</span>
                <button class="sound-toggle" id="soundToggle">🔊</button>
            </div>
            <button id="exitBtn">✕ Exit</button>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas" width="900" height="600"></canvas>
            
            <div class="game-hud">
                <div id="player1Health" class="health-bar">
                    <div class="health-fill" style="width:100%"></div>
                    <span class="health-text">❤️ 100%</span>
                </div>
                <div class="hud-center">
                    <div id="gameStatus">⏳ Waiting...</div>
                    <div id="scoreDisplay">🏆 0</div>
                </div>
                <div id="player2Health" class="health-bar">
                    <div class="health-fill" style="width:100%"></div>
                    <span class="health-text">❤️ 100%</span>
                </div>
            </div>
            
            <div class="weapon-hud" id="weaponHud">
                <span class="weapon-icon">🔫</span>
                <span class="weapon-name" id="weaponName">Pistol</span>
                <span class="weapon-damage" id="weaponDamage">⚔️ 12</span>
            </div>
            
            <div class="pickup-indicator" id="pickupIndicator">📦 Press E to pickup</div>
            
            <div class="kill-feed" id="killFeed"></div>
            
            <div class="center-announcement" id="centerAnnouncement">
                <div class="title" id="announceTitle">⚔️ FIGHT!</div>
                <div class="subtitle" id="announceSubtitle">Get ready</div>
            </div>
            
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-box">
                    <div class="title" id="gameOverTitle">🏆 GAME OVER</div>
                    <div class="subtitle" id="gameOverSubtitle">The battle has ended</div>
                    <div class="winner-info" id="winnerInfo">
                        <span class="name" id="winnerName">Player</span> won! 🎉
                    </div>
                    <div class="stats">
                        <div class="stat-item"><div class="value kills" id="finalKills">0</div><div class="label">💀 Kills</div></div>
                        <div class="stat-item"><div class="value deaths" id="finalDeaths">0</div><div class="label">☠️ Deaths</div></div>
                        <div class="stat-item"><div class="value score" id="finalScore">0</div><div class="label">🏆 Score</div></div>
                    </div>
                    <button class="restart-btn" id="restartBtn">🔄 Play Again</button>
                    <button class="restart-btn secondary" id="exitToMenuBtn">🏠 Exit to Menu</button>
                    <div class="countdown" id="countdownTimer">Restarting in <span class="time">10</span>s</div>
                </div>
            </div>
            
            <div class="confetti-container" id="confettiContainer"></div>
        </div>
        
        <!-- Touch Controls -->
        <div class="touch-controls">
            <div class="touch-dpad">
                <div class="touch-btn empty"></div>
                <div class="touch-btn" data-key="ArrowUp">▲</div>
                <div class="touch-btn empty"></div>
                <div class="touch-btn" data-key="ArrowLeft">◄</div>
                <div class="touch-btn center" data-key=" ">🎯</div>
                <div class="touch-btn" data-key="ArrowRight">►</div>
                <div class="touch-btn empty"></div>
                <div class="touch-btn" data-key="ArrowDown">▼</div>

            <div class="touch-actions">

    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ============================================================
        // FORCE KEYBOARD ON MOBILE
        // ============================================================
        // Create a hidden input to focus and show keyboard
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'text';
        hiddenInput.style.cssText = `
            position: fixed;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        `;
        document.body.appendChild(hiddenInput);
        
        // Function to show keyboard
        function showKeyboard() {
            hiddenInput.focus();
            // Keep focus on canvas
            setTimeout(() => {
                canvas.focus();
            }, 100);
        }
        
        // Show keyboard on any touch/click
        document.addEventListener('touchstart', () => {
            showKeyboard();
        });
        
        document.addEventListener('click', () => {
            showKeyboard();
        });
        
        // Keep canvas focus
        canvas.setAttribute('tabindex', '0');
        canvas.focus();
        
        // ============================================================
        // WEAPONS
        // ============================================================
        const WEAPONS = {
            pistol: { name: 'Pistol', icon: '🔫', damage: 12, speed: 8, fireRate: 300, color: '#ff6b6b' },
            rifle: { name: 'Rifle', icon: '🔫', damage: 18, speed: 10, fireRate: 400, color: '#4facfe' },
            shotgun: { name: 'Shotgun', icon: '💥', damage: 25, speed: 6, fireRate: 500, color: '#ffd93d' },
            sniper: { name: 'Sniper', icon: '🎯', damage: 40, speed: 14, fireRate: 800, color: '#a29bfe' },
            rocket: { name: 'Rocket', icon: '🚀', damage: 50, speed: 5, fireRate: 1000, color: '#ff6b00' },
            laser: { name: 'Laser', icon: '⚡', damage: 15, speed: 12, fireRate: 200, color: '#00ff88' },
        };

        // ============================================================
        // SOUND SYSTEM
        // ============================================================
        class SoundSystem {
            constructor() {
                this.audioCtx = null;
                this.enabled = true;
                this.init();
            }
            init() {
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) { this.enabled = false; }
            }
            playShoot() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, this.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(this.audioCtx.currentTime);
                    osc.stop(this.audioCtx.currentTime + 0.08);
                } catch(e) {}
            }
            playHit() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, this.audioCtx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.5, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.06);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(this.audioCtx.currentTime);
                    osc.stop(this.audioCtx.currentTime + 0.06);
                } catch(e) {}
            }
            playDeath() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(this.audioCtx.currentTime);
                    osc.stop(this.audioCtx.currentTime + 0.6);
                } catch(e) {}
            }
            playVictory() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const notes = [523, 587, 659, 784];
                    notes.forEach((freq, i) => {
                        const osc = this.audioCtx.createOscillator();
                        const gain = this.audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + i * 0.12);
                        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + i * 0.12 + 0.2);
                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        osc.start(this.audioCtx.currentTime + i * 0.12);
                        osc.stop(this.audioCtx.currentTime + i * 0.12 + 0.2);
                    });
                } catch(e) {}
            }
            playPickup() {
                if (!this.enabled || !this.audioCtx) return;
                try {
                    const notes = [523, 659, 784];
                    notes.forEach((freq, i) => {
                        const osc = this.audioCtx.createOscillator();
                        const gain = this.audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + i * 0.06);
                        gain.gain.setValueAtTime(0.15, this.audioCtx.currentTime + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + i * 0.06 + 0.1);
                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        osc.start(this.audioCtx.currentTime + i * 0.06);
                        osc.stop(this.audioCtx.currentTime + i * 0.06 + 0.1);
                    });
                } catch(e) {}
            }
        }

        // ============================================================
        // MAIN GAME
        // ============================================================
        const socket = io({ transports: ['websocket', 'polling'] });
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sound = new SoundSystem();

        let players = {};
        let localPlayerId = null;
        let roomId = new URLSearchParams(window.location.search).get('roomId');
        let keys = {};
        let gameStatus = 'waiting';
        let projectiles = [];
        let particles = [];
        let weaponsOnMap = [];
        let comboTexts = [];
        let screenShake = 0;
        let nearbyWeapon = null;
        let currentWeapon = 'pistol';
        let playerCount = 0;
        let maxPlayers = 8;
        let kills = 0;
        let deaths = 0;
        let gameOver = false;
        let restartCountdown = 10;
        let countdownInterval = null;
        let isWaitingForRestart = false;
        let localPlayer = null;
        let aliveCount = 0;
        let localTeam = 'red';

        // ============================================================
        // TEAM ASSIGNMENT
        // ============================================================
        function assignTeam() {
            const playersList = Object.values(players);
            const redCount = playersList.filter(p => p.team === 'red').length;
            const blueCount = playersList.filter(p => p.team === 'blue').length;
            if (redCount <= blueCount) {
                return 'red';
            } else {
                return 'blue';
            }
        }

        function getTeamColor(team) {
            return team === 'red' ? '#ff6b6b' : '#4facfe';
        }

        function getTeamName(team) {
            return team === 'red' ? '🔴 Red Team' : '🔵 Blue Team';
        }

        // ============================================================
        // UI FUNCTIONS
        // ============================================================
        function showAnnouncement(title, subtitle, type = 'info', duration = 2000) {
            const container = document.getElementById('centerAnnouncement');
            const titleEl = document.getElementById('announceTitle');
            const subtitleEl = document.getElementById('announceSubtitle');
            titleEl.textContent = title;
            titleEl.className = 'title ' + type;
            subtitleEl.textContent = subtitle || '';
            container.classList.add('show');
            if (window.announcementTimeout) clearTimeout(window.announcementTimeout);
            window.announcementTimeout = setTimeout(() => {
                container.classList.remove('show');
            }, duration);
        }

        function showToast(msg, color = '#ffd93d') {
            const el = document.getElementById('chatMessages');
            if (!el) return;
            const div = document.createElement('div');
            div.textContent = msg;
            div.style.color = color;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
            setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
        }

        function addKillFeed(killerName, victimName, weapon, killerTeam) {
            const feed = document.getElementById('killFeed');
            const div = document.createElement('div');
            div.className = 'kill-msg';
            const weaponInfo = WEAPONS[weapon] || WEAPONS.pistol;
            const teamClass = killerTeam === 'red' ? 'red' : 'blue';
            div.innerHTML = `
                <span class="killer ${teamClass}">${killerName}</span>
                💀 
                <span class="victim">${victimName}</span>
                <span class="weapon">${weaponInfo.icon}</span>
            `;
            feed.appendChild(div);
            setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
            if (feed.children.length > 5) feed.removeChild(feed.firstChild);
        }

        function showGameOver(winner) {
            if (gameOver) return;
            gameOver = true;
            const overlay = document.getElementById('gameOverOverlay');
            const title = document.getElementById('gameOverTitle');
            const subtitle = document.getElementById('gameOverSubtitle');
            const winnerInfo = document.getElementById('winnerInfo');
            const winnerName = document.getElementById('winnerName');
            document.getElementById('finalKills').textContent = localPlayer?.kills || 0;
            document.getElementById('finalDeaths').textContent = localPlayer?.deaths || 0;
            document.getElementById('finalScore').textContent = localPlayer?.score || 0;
            
            if (winner) {
                const isLocalWinner = winner.id === localPlayerId;
                title.textContent = isLocalWinner ? '🏆 YOU WON!' : '💀 GAME OVER';
                title.className = 'title ' + (isLocalWinner ? 'win' : 'lose');
                subtitle.textContent = isLocalWinner ? 'Congratulations!' : 'Better luck next time!';
                const teamColor = winner.team === 'red' ? '🔴' : '🔵';
                winnerInfo.innerHTML = `<span class="name">${teamColor} ${winner.name}</span> won the game! 🎉`;
                winnerName.textContent = winner.name;
                if (isLocalWinner) { createConfetti(); sound.playVictory(); }
                else { sound.playDeath(); }
            } else {
                title.textContent = '🤝 DRAW';
                title.className = 'title';
                subtitle.textContent = 'All players eliminated!';
                winnerInfo.innerHTML = `<span style="color:#aaa;">No one survived!</span>`;
                sound.playDeath();
            }
            overlay.classList.add('show');
            document.getElementById('gameStatus').textContent = '🏁 GAME OVER';
            startRestartCountdown();
        }

        function startRestartCountdown() {
            restartCountdown = 10;
            const timerEl = document.querySelector('#countdownTimer .time');
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                restartCountdown--;
                if (timerEl) timerEl.textContent = restartCountdown;
                if (restartCountdown <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    restartGame();
                }
            }, 1000);
        }

        function restartGame() {
            if (isWaitingForRestart) return;
            isWaitingForRestart = true;
            document.getElementById('gameOverOverlay').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';
            socket.emit('restart-game', { roomId: roomId });
            gameOver = false;
            projectiles = [];
            particles = [];
            comboTexts = [];
            setTimeout(() => { isWaitingForRestart = false; }, 2000);
        }

        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4facfe', '#a29bfe', '#ff9f43'];
            for (let i = 0; i < 40; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const size = 5 + Math.random() * 6;
                el.style.cssText = `
                    left: ${Math.random() * 100}%;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    animation-delay: ${Math.random() * 2}s;
                    animation-duration: ${2 + Math.random() * 2}s;
                `;
                container.appendChild(el);
            }
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        // ============================================================
        // PLAYER CLASS
        // ============================================================
        class Player {
            constructor(id, name, character, x, y, team) {
                this.id = id;
                this.name = name;
                this.character = character || 'soldier';
                this.x = x || 400;
                this.y = y || 300;
                this.width = 32;
                this.height = 44;
                this.health = 100;
                this.maxHealth = 100;
                this.direction = 'right';
                this.isAttacking = false;
                this.attackTimer = 0;
                this.score = 0;
                this.hitFlash = 0;
                this.comboCount = 0;
                this.lastAttackTime = 0;
                this.isShooting = false;
                this.shootCooldown = 0;
                this.weapon = 'pistol';
                this.kills = 0;
                this.deaths = 0;
                this.respawnTimer = 0;
                this.isDead = false;
                this.team = team || 'red';
                this.teamColor = getTeamColor(this.team);
                this.color = this.teamColor;
            }

            draw(ctx) {
                if (this.isDead) {
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = '#666';
                    ctx.font = '8px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('💀 Respawn...', this.x, this.y - 20);
                    ctx.globalAlpha = 1;
                    return;
                }

                const x = this.x - this.width / 2;
                const y = this.y - this.height / 2;

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.height / 2 + 3, 16, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.direction === 'left') ctx.scale(-1, 1);

                const bodyColor = this.hitFlash > 0 ? '#ff0000' : this.teamColor;
                ctx.shadowBlur = this.hitFlash > 0 ? 15 : 4;
                ctx.shadowColor = this.hitFlash > 0 ? '#ff0000' : 'rgba(0,0,0,0.3)';
                
                ctx.fillStyle = bodyColor;
                ctx.fillRect(-10, -3, 20, 18);
                const darkColor = this.team === 'red' ? '#cc3333' : '#3366cc';
                ctx.fillStyle = this.hitFlash > 0 ? '#ff3333' : darkColor;
                ctx.fillRect(-7, 0, 14, 2);
                ctx.fillRect(-7, 5, 14, 2);
                ctx.fillRect(-7, 10, 14, 2);

                ctx.shadowBlur = this.hitFlash > 0 ? 15 : 4;
                ctx.fillStyle = this.hitFlash > 0 ? '#ff0000' : '#fd79a8';
                ctx.beginPath();
                ctx.arc(0, -11, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = this.hitFlash > 0 ? '#ff3333' : '#2d3436';
                ctx.beginPath();
                ctx.arc(0, -12, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(-10, -15, 20, 3);
                ctx.fillStyle = this.team === 'red' ? '#ff4444' : '#4488ff';
                ctx.font = '6px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.team === 'red' ? 'R' : 'B', 0, -14);

                ctx.shadowBlur = 4;
                ctx.fillStyle = this.hitFlash > 0 ? '#ff0000' : '#fd79a8';
                if (this.isAttacking) {
                    const progress = 1 - (this.attackTimer / 20);
                    ctx.fillRect(10, 0, 10 + progress * 16, 5);
                    ctx.fillStyle = '#ffd93d';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ffd93d';
                    ctx.fillRect(15, -2, 12 + progress * 8, 8);
                } else {
                    ctx.fillRect(-13, 0, 5, 10);
                    ctx.fillRect(8, 0, 5, 10);
                }

                const weapon = WEAPONS[this.weapon] || WEAPONS.pistol;
                ctx.shadowBlur = this.isShooting ? 12 : 4;
                ctx.shadowColor = this.isShooting ? weapon.color : 'rgba(0,0,0,0.3)';
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(10, -2, 16, 3);
                ctx.fillStyle = '#2d3436';
                ctx.fillRect(10 + 13, -2, 3, 4);
                
                if (this.isShooting && this.shootCooldown > 8) {
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = weapon.color;
                    ctx.fillStyle = '#ffd93d';
                    ctx.beginPath();
                    ctx.arc(10 + 16 + 3, 0, 4 + Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = weapon.color;
                    ctx.beginPath();
                    ctx.arc(10 + 16 + 5, 0, 2 + Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowBlur = 4;
                ctx.fillStyle = '#2d3436';
                ctx.fillRect(-8, 16, 6, 10);
                ctx.fillRect(2, 16, 6, 10);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(-9, 17, 7, 2);
                ctx.fillRect(2, 17, 7, 2);

                ctx.shadowBlur = 0;
                ctx.restore();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x - 2, y - 16, this.width + 4, 10);
                ctx.fillStyle = this.id === localPlayerId ? '#ffd93d' : '#fff';
                ctx.font = 'bold 7px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, this.x, y - 8);

                if (this.comboCount > 1) {
                    ctx.fillStyle = '#ffd93d';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffd93d';
                    ctx.fillText(`${this.comboCount}x COMBO!`, this.x, y - 28);
                    ctx.shadowBlur = 0;
                }

                const hw = this.width + 4;
                const hx = x - 2;
                const hy = y - 26;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(hx, hy, hw, 3);
                const hp = this.health / this.maxHealth;
                ctx.fillStyle = hp > 0.5 ? '#6bcb77' : hp > 0.25 ? '#ffd93d' : '#ff6b6b';
                ctx.fillRect(hx + 1, hy + 1, (hw - 2) * hp, 1);

                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(x + this.width / 2 - 6, y - 22, 12, 5);
                ctx.fillStyle = '#fff';
                ctx.font = '5px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(weapon.icon, this.x, y - 19);
            }

            update() {
                if (this.isDead) {
                    this.respawnTimer--;
                    if (this.respawnTimer <= 0) {
                        this.isDead = false;
                        this.health = this.maxHealth;
                        this.x = 100 + Math.random() * 700;
                        this.y = 100 + Math.random() * 400;
                        this.comboCount = 0;
                        if (this.id === localPlayerId) {
                            showAnnouncement('🔄 Respawned!', 'Back in action!', 'info', 1500);
                        }
                        updateAliveCount();
                        const alive = Object.values(players).filter(p => !p.isDead);
                        if (alive.length >= 2 && gameOver) {
                            gameOver = false;
                            document.getElementById('gameOverOverlay').classList.remove('show');
                            document.getElementById('gameStatus').textContent = '⚔️ FIGHT!';
                            showAnnouncement('⚔️ New Round!', 'Fight!', 'info', 2000);
                        }
                    }
                    return;
                }
                if (this.attackTimer > 0) {
                    this.attackTimer--;
                    if (this.attackTimer === 0) this.isAttacking = false;
                }
                if (this.hitFlash > 0) this.hitFlash--;
                if (this.shootCooldown > 0) {
                    this.shootCooldown--;
                    if (this.shootCooldown < 8) this.isShooting = false;
                }
            }

            attack() {
                this.isAttacking = true;
                this.attackTimer = 20;
                this.lastAttackTime = Date.now();
            }

            shoot(direction) {
                this.isShooting = true;
                this.shootCooldown = 15;
                this.direction = direction;
                this.lastAttackTime = Date.now();
            }

            takeDamage(damage) {
                this.health = Math.max(0, this.health - damage);
                this.hitFlash = 15;
                if (this.health <= 0) {
                    this.isDead = true;
                    this.respawnTimer = 60;
                    this.deaths++;
                    if (this.id === localPlayerId) {
                        document.getElementById('deathsDisplay').textContent = '☠️ ' + this.deaths;
                    }
                    updateAliveCount();
                    const alive = Object.values(players).filter(p => !p.isDead);
                    if (alive.length <= 1 && Object.keys(players).length >= 2) {
                        setTimeout(() => {
                            const stillAlive = Object.values(players).filter(p => !p.isDead);
                            if (stillAlive.length <= 1 && Object.keys(players).length >= 2) {
                                showGameOver(stillAlive.length === 1 ? stillAlive[0] : null);
                            }
                        }, 2000);
                    }
                }
            }
        }

        // ============================================================
        // PARTICLES
        // ============================================================
        class Particle {
            constructor(x, y, color, size, vx, vy, life) {
                this.x = x; this.y = y; this.color = color; this.size = size || 3;
                this.vx = vx || (Math.random() - 0.5) * 5; this.vy = vy || (Math.random() - 0.5) * 5 - 1.5;
                this.life = life || 20; this.maxLife = this.life;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += 0.1;
                this.life--; this.size *= 0.97;
            }
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 8; ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(1, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            }
            isDead() { return this.life <= 0 || this.size <= 0.5; }
        }

                    handleAttack('special');
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;

                    handlePickup();
                } else if (key === 'j') {
                    handleAttack('light');

        function handleShoot() {
            if (!localPlayer || gameStatus !== 'playing' || gameOver || localPlayer.isDead) return;
            const now = Date.now();
            const weapon = WEAPONS[localPlayer.weapon] || WEAPONS.pistol;
            if (now - localPlayer.lastAttackTime < weapon.fireRate) return;
            
            socket.emit('player-shoot', {
                x: localPlayer.x,
                y: localPlayer.y,
                direction: localPlayer.direction,
                attackType: 'light'
            });
            localPlayer.shoot(localPlayer.direction);
            sound.playShoot();
            localPlayer.lastAttackTime = now;
            showKeyboard();
        }

        function handlePickup() {
            if (nearbyWeapon && gameStatus === 'playing' && !gameOver) {
                socket.emit('pickup-weapon', {
                    weaponId: nearbyWeapon.id,
                    weaponType: nearbyWeapon.type
                });
                nearbyWeapon = null;
                document.getElementById('pickupIndicator').classList.remove('show');
                showKeyboard();
            }
        }

        function handleAttack(type) {
            if (!localPlayer || gameStatus !== 'playing' || gameOver || localPlayer.isDead) return;
            if (localPlayer.isAttacking) return;
            const now = Date.now();
            const cooldowns = { light: 300, heavy: 400, special: 600 };
            if (now - localPlayer.lastAttackTime < cooldowns[type]) return;
            
            socket.emit('player-attack', { attackType: type });
            localPlayer.attack();
            sound.playHit();
            localPlayer.lastAttackTime = now;
            showKeyboard();
        }

        // Canvas click for aiming
        canvas.addEventListener('click', (e) => {
            if (!localPlayer || gameStatus !== 'playing' || gameOver || localPlayer.isDead) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;
            
            const dx = clickX - localPlayer.x;
            const dy = clickY - localPlayer.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const dir = clickX > localPlayer.x ? 'right' : 'left';
            localPlayer.direction = dir;
            
            if (distance < 80) {
                if (!localPlayer.isAttacking) {
                    socket.emit('player-attack', { attackType: 'light' });
                    localPlayer.attack();
                    sound.playHit();
                }
            } else {
                handleShoot();
            }
            showKeyboard();
        });

        // ============================================================
        // UI FUNCTIONS
        // ============================================================
        function updateWeaponHUD(weaponType) {
            const weapon = WEAPONS[weaponType] || WEAPONS.pistol;
            document.getElementById('weaponName').textContent = weapon.name;
            document.getElementById('weaponDamage').textContent = `⚔️ ${weapon.damage}`;
            document.querySelector('.weapon-hud .weapon-icon').textContent = weapon.icon;
        }

        function checkNearbyWeapons(player, weapons) {
            if (!player || !weapons) return;
            let found = null;
            for (const w of weapons) {
                const dx = player.x - w.x;
                const dy = player.y - w.y;
                if (Math.sqrt(dx * dx + dy * dy) < 40) {
                    found = w;
                    break;
                }
            }
            if (found) {
                nearbyWeapon = found;
                document.getElementById('pickupIndicator').classList.add('show');
                document.getElementById('pickupIndicator').innerHTML = 
                    `📦 Press E to pickup ${WEAPONS[found.type]?.icon || '🔫'} ${WEAPONS[found.type]?.name || found.type}`;
            } else {
                nearbyWeapon = null;
                document.getElementById('pickupIndicator').classList.remove('show');
            }
        }

        function updateHealthBars() {
            const list = Object.values(players);
            if (list.length >= 2) {
                const p1 = list[0], p2 = list[1];
                document.querySelector('#player1Health .health-fill').style.width = `${p1.health}%`;
                document.querySelector('#player1Health .health-text').textContent = `❤️ ${Math.round(p1.health)}%`;
                document.querySelector('#player2Health .health-fill').style.width = `${p2.health}%`;
                document.querySelector('#player2Health .health-text').textContent = `❤️ ${Math.round(p2.health)}%`;
            } else if (list.length === 1) {
                const p = list[0];
                document.querySelector('#player1Health .health-fill').style.width = `${p.health}%`;
                document.querySelector('#player1Health .health-text').textContent = `❤️ ${Math.round(p.health)}%`;
            }
        }

        function updateScoreDisplay() {
            const list = Object.values(players);
            if (list.length >= 2) {
                document.getElementById('scoreDisplay').textContent = `🏆 ${list[0].score || 0} - ${list[1].score || 0}`;
            } else if (list.length === 1) {
                document.getElementById('scoreDisplay').textContent = `🏆 ${list[0].score || 0}`;
            }
        }

        // ============================================================
        // DRAW FUNCTIONS
        // ============================================================
        function drawWeapons(ctx) {
            for (const w of weaponsOnMap) {
                const weapon = WEAPONS[w.type] || WEAPONS.pistol;
                const grad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, 18);
                grad.addColorStop(0, weapon.color + '30');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.arc(w.x, w.y, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = weapon.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 11, 0, Math.PI * 2);
                ctx.stroke();
                ctx.font = '13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.fillText(weapon.icon, w.x, w.y);
            }
        }

        // ============================================================
        // GAME LOOP
        // ============================================================
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (localPlayer && gameStatus === 'playing' && !gameOver && !localPlayer.isDead) {
                let dx = 0, dy = 0;
                if (keys['ArrowUp']) dy = -2.5;
                if (keys['ArrowDown']) dy = 2.5;
                if (keys['ArrowLeft']) { dx = -2.5; localPlayer.direction = 'left'; }
                if (keys['ArrowRight']) { dx = 2.5; localPlayer.direction = 'right'; }
                
                if (dx !== 0 || dy !== 0) {
                    const newX = Math.max(20, Math.min(880, localPlayer.x + dx));
                    const newY = Math.max(20, Math.min(580, localPlayer.y + dy));
                    localPlayer.x = newX;
                    localPlayer.y = newY;
                    socket.emit('player-move', { x: newX, y: newY, direction: localPlayer.direction });
                }
            }
            
            Object.values(players).forEach(p => p.update());
            
            particles = particles.filter(p => { p.update(); return !p.isDead(); });
            
            comboTexts = comboTexts.filter(t => {
                t.y -= 0.7;
                t.life--;
                return t.life > 0;
            });
            
            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.1) screenShake = 0;
            
            if (localPlayer) {
                checkNearbyWeapons(localPlayer, weaponsOnMap);
            }
            
            updateHealthBars();
            updateScoreDisplay();
            updateAliveCount();
        }

        function render() {
            ctx.save();
            
            if (screenShake > 0.3) {
                ctx.translate((Math.random() - 0.5) * screenShake * 1.5, (Math.random() - 0.5) * screenShake * 1.5);
            }
            
            const grad = ctx.createLinearGradient(0, 0, 0, 600);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.5, '#1a0a2e');
            grad.addColorStop(1, '#0f3460');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 900, 600);
            
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            ctx.fillRect(0, 550, 900, 50);
            
            // Team zones
            ctx.fillStyle = 'rgba(255,0,0,0.04)';
            ctx.fillRect(0, 0, 450, 600);
            ctx.fillStyle = 'rgba(0,100,255,0.04)';
            ctx.fillRect(450, 0, 450, 600);
            
            // Team labels
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,0,0,0.12)';
            ctx.fillText('🔴 RED', 225, 25);
            ctx.fillStyle = 'rgba(0,100,255,0.12)';
            ctx.fillText('🔵 BLUE', 675, 25);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(450, 300, 180, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.02)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 900; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 600); ctx.stroke();
            }
            for (let i = 0; i < 600; i += 50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(900, i); ctx.stroke();
            }
            
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(450, 50);
            ctx.lineTo(450, 550);
            ctx.stroke();
            ctx.setLineDash([]);
            
            projectiles.forEach(p => {
                if (p.trail) {
                    p.trail.forEach((pos, i) => {
                        const alpha = (i / p.trail.length) * 0.3;
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = p.color || '#ffd93d';
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, p.radius * (i / p.trail.length) * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color || '#ffd93d';
                const grad2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
                grad2.addColorStop(0, '#ffffff');
                grad2.addColorStop(0.3, p.color || '#ffd93d');
                grad2.addColorStop(1, '#ff6b00');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            drawWeapons(ctx);
            particles.forEach(p => p.draw(ctx));
            
            const sorted = Object.values(players).sort((a, b) => a.y - b.y);
            sorted.forEach(p => p.draw(ctx));
            
            comboTexts.forEach(t => {
                ctx.globalAlpha = t.life / 40;
                ctx.fillStyle = t.color;
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 12;
                ctx.shadowColor = t.color;
                ctx.fillText(t.text, t.x, t.y);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });
            
            ctx.restore();
        }

        // ============================================================
        // BUTTONS
        // ============================================================
        document.getElementById('restartBtn').addEventListener('click', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            restartGame();
        });
        
        document.getElementById('exitToMenuBtn').addEventListener('click', () => {
            if (confirm('Exit to menu?')) window.location.href = '/';
        });

        document.getElementById('soundToggle').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('soundToggle').textContent = sound.enabled ? '🔊' : '🔇';
            if (sound.enabled && sound.audioCtx && sound.audioCtx.state === 'suspended') {
                sound.audioCtx.resume();
            }
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            if (confirm('Exit game?')) window.location.href = '/';
        });

        // ============================================================
        // RESIZE CANVAS
        // ============================================================
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const aspect = 900 / 600;
            
            let w = width;
            let h = w / aspect;
            if (h > height) { h = height; w = h * aspect; }
            
            canvas.width = 900;
            canvas.height = 600;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
        
        // Initial resize
        setTimeout(resizeCanvas, 100);
        resizeCanvas();
        
        // Show keyboard on page load
        setTimeout(showKeyboard, 500);
        
        gameLoop();
        
        console.log('🎮 Team Battle Game Loaded!');
        console.log('🔴 RED TEAM vs 🔵 BLUE TEAM');
        console.log('⬆⬇⬅➡ Use Arrow Keys or Touch D-Pad to move!');
        console.log('🔫 Press Space or SHOOT button to shoot!');
        console.log('📦 Press E or PICKUP button to pickup weapons!');
        console.log('⚔️ You cannot kill yourself!');
        console.log('⌨️ Keyboard is forced on mobile!');
    </script>
</body>
